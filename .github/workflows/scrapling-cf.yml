name: scrapling-cf

# Coba tembus Cloudflare prod (dashboard.api.co.id) pakai scrapling StealthyFetcher.
on:
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/scrapling_cf.py"

jobs:
  cf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h / | tail -1
      - name: Install scrapling
        run: |
          python -m pip install --quiet "scrapling[fetchers]" requests
          scrapling install || python -m playwright install --with-deps chromium
      - name: Run
        run: python scripts/scrapling_cf.py
      - name: Publish result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrapling-result
          path: result.json
